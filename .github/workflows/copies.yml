# The copies check ("One fact, one place" in the core's roles/shared/how-to-work.md), for every project that takes the core:
# a new copy of code, or of the rule files' prose, fails; the old ones its baseline lists are removed over time, and
# against the branch a PR merges into the baseline may only shrink. With it, the pointer check (every pointer in the
# rule files leads somewhere) and the reading-size check (the files every session reads keep to their marks, and a file
# past the split mark is split before it is changed), with the marks the project names; and checks that need no
# config: the workflow check (floor rule 2: no workflow names the trigger it forbids; nor gives a key twice in one
# mapping, which GitHub refuses, what the base already held noted and passed), the entry-files check (each
# agent tool's entry file pulls in what AGENTS.md names, what the base already lacked noted and passed:
# tasks/tools.md), and the manifest check, which
# reports and never fails (every module the manifest's list neither takes nor leaves out, every slot a taken module uses
# that no row fills); and the shape check (the core's tasks/code-shape.md: nothing new of a function past a mark, an
# import across a boundary nobody declared, a cycle or a tie to one platform, what stood before listed in a baseline
# that only shrinks), which holds a project that has not written its config yet to the starter kit's own, with the
# pull request's base as its baseline. A project calls it (workflow_call) on every pull request and push to main, docs-only changes
# included, since the rule files are what it guards most, pinned to a full commit SHA ("How a project takes the core"
# in README.md, point 5). It runs the project's own core/scripts/copies.mjs, pointers.mjs, reading-size.mjs,
# workflows.mjs, entry-files.mjs, manifest-reads.mjs and shape.mjs, with the configs the project names (the shape check's by its
# manifest's row, or where the starter kit writes it), on the core's one exact Node; Node's own modules only, no
# package installed. Read-only, with no secret.
name: copies

on:
  workflow_call:
    inputs:
      config:
        description: The copies check's config, a JSON file in the calling repository (core/scripts/copies.mjs).
        required: true
        type: string
      sizes:
        description: The reading-size check's marks, a JSON file of the caller's (core/scripts/reading-size.mjs).
        required: true
        type: string

permissions:
  contents: read

jobs:
  copies:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # (a pull request's run gives way to a newer one for the same pull request, whose head it no longer is; a run on
    # main, a schedule or a start by hand is its own group and is never cancelled; #388)
    concurrency:
      group: copies-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}-${{ inputs.config }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing after the checkout needs the token
      - name: Where the core's copy stands, for the copies, pointer, size and shape checks (core-manifest.md's "Core:" line; the core's tasks/repositories.md)
        id: core-at
        run: |
          at=$(sed -n -E 's#^Core: [^ ]+( at [0-9a-f]{40}, copied whole|, carried by ([A-Za-z0-9_][A-Za-z0-9._/-]*)/) under ([A-Za-z0-9_][A-Za-z0-9._/-]*/).*#\3 \2#p' core-manifest.md 2>/dev/null | head -n 1)
          set -- ${at:-core/}; [ -z "${2:-}" ] || [ -e "$1scripts" ] || git submodule update --init --depth 1 -- "$2" || { echo "FAIL the library $2, a submodule that carries the core, could not be fetched here. Mend: commit the library's files in this repository, or make the submodule one this workflow can fetch with no token."; exit 1; }; echo "CORE_AT=$1" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ env.CORE_AT }}.node-version # the one exact Node ("Node" in the core's tasks/updates.md)
      - name: The base branch's latest commit, for its baseline and marks (not the whole history)
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: git fetch --no-tags --depth=1 origin "+refs/heads/$BASE:refs/remotes/origin/$BASE"
      - name: No new copies
        env:
          COPIES_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
          CONFIG: ${{ inputs.config }}
        run: node "$CORE_AT"scripts/copies.mjs "$CONFIG"
      - name: Every pointer in the rule files leads somewhere
        if: ${{ !cancelled() }}
        run: node "$CORE_AT"scripts/pointers.mjs
      - name: The files every session reads keep to their marks
        if: ${{ !cancelled() }}
        env:
          SIZES_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
          SIZES: ${{ inputs.sizes }}
        run: node "$CORE_AT"scripts/reading-size.mjs "$SIZES"
      - name: No workflow names the forbidden trigger or gives a key twice
        if: ${{ !cancelled() }}
        env:
          WORKFLOWS_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: node "$CORE_AT"scripts/workflows.mjs
      - name: Each agent tool's entry file pulls in every file AGENTS.md names
        if: ${{ !cancelled() }}
        env:
          ENTRY_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: node "$CORE_AT"scripts/entry-files.mjs
      - name: The manifest takes or leaves out each module and fills each slot they use (reports, never fails)
        if: ${{ !cancelled() }}
        run: node "$CORE_AT"scripts/manifest-reads.mjs
      - name: Nothing new in how the code is put together
        if: ${{ !cancelled() }}
        env:
          SHAPE_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: node "$CORE_AT"scripts/shape.mjs
