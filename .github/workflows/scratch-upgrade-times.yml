# Scratch: measures the upgrade test's parts on Windows (#1240). Never merged; its pull request is closed once read.
name: scratch-upgrade-times
on:
  pull_request:
permissions:
  contents: read
jobs:
  upgrade:
    name: upgrade (windows-latest, ${{ matrix.part }})
    strategy:
      fail-fast: false
      matrix:
        part: [older-npm, older-dotnet, older-pre, newer-npm, newer-dotnet]
    runs-on: windows-latest
    timeout-minutes: 50
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: node scripts/install.mjs all
      - env:
          PART: ${{ matrix.part }}
        run: node scripts/shape.mjs .github/shape.json --suite "upgrade-$PART" -- node tests/upgrade-test.mjs --part "$PART"
