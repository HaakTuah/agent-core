# A trial for #546's choice record, on a scratch branch that never merges: Semgrep's engine alone on each system.
name: trial-546
on:
  push:
    branches: [trial-546-engine]
permissions:
  contents: read
jobs:
  engine:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            wheel: https://files.pythonhosted.org/packages/8e/8e/c8d5135ff77a60e825c08b68272a924572e59841d01beba29be7041d2c75/semgrep-1.185.0-cp310.cp311.cp312.cp313.cp314.py310.py311.py312.py313.py314-none-win_amd64.whl
            sum: 91812ac0856cfe5b6135a4dffde3052a04c36a46e4e82e78793e3a07e51d7894
          - os: macos-14
            wheel: https://files.pythonhosted.org/packages/63/8a/746b73f404709f89cecbd80f7dcd4e347b21353bfdea163cb23158d4593f/semgrep-1.185.0-cp310.cp311.cp312.cp313.cp314.py310.py311.py312.py313.py314-none-macosx_11_0_arm64.whl
            sum: d54c7dc22f6f360e0f9f850b1ecdfe00ec755600f9cf2ec6be3928b42818f1b4
          - os: ubuntu-latest
            wheel: https://files.pythonhosted.org/packages/f2/13/0d4dc8d124794105f300082c46e3d8ad45eac7af63113b57a5966629b5a3/semgrep-1.185.0-cp310.cp311.cp312.cp313.cp314.py310.py311.py312.py313.py314-none-manylinux_2_34_x86_64.whl
            sum: 0eb6aaadad5b957af96d1300487e10af1dc8016e8ef53072effb48cd4906c02b
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The engine alone, on the samples
        run: node trial-546/run.mjs "${{ matrix.wheel }}" "${{ matrix.sum }}"
