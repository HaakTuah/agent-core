name: probe-951
on:
  push:
    branches: [fix-951-projects-time]
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: node scripts/install.mjs all
      - name: check-test with a profile
        env:
          PROF_LOG: ${{ runner.temp }}/prof.log
        run: |
          start=$(date +%s)
          NODE_OPTIONS="--import file:///$(pwd)/probe/prof.mjs" node tests/check-test.mjs > "$RUNNER_TEMP/out.txt" 2>&1 || true
          echo "check-test took $(( $(date +%s) - start )) s"; tail -2 "$RUNNER_TEMP/out.txt"
          node probe/sum.mjs "$RUNNER_TEMP/prof.log"
