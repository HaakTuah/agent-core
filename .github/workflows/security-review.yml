# The security-review check (floor rule 8: a PR that touches a way in merges only after its security review has run, and
# none with a blocking security finding open), for every project that takes the core: it gives the head commit of each
# open pull request that is no draft a commit status, "security-review", that says whether its security review has run,
# and beside it a second, "code-review", that says whether a code review running on that commit has finished, and
# whether a pull request that needs a code review has had one (scripts/code-review-wait.mjs; modules/reviews.md,
# "Which" and point 2: a review already running is waited for, and one that hangs is taken over, its review posted in a
# comment that opens "Code review:" naming the commit by its whole SHA, which ends the wait; such a comment starts the
# job only where the check is not advisory, since an advisory status passes anyway and the next push or Codex's own
# summary rewrites it, so that no project starts a job for it it did not start before).
# Proof is the summary Codex's own app keeps on the pull request, saying its security review is completed, or a comment
# that opens "Security review:" from the repository's owner, or an account the caller names (the input "reviewers"),
# which is how the fallback reviewer's or another reviewer's is posted (modules/reviews.md, point 3); a review of an
# earlier commit than the head only where updates from main alone follow it, each the merge git makes of its parents
# (scripts/clean-merges.mjs proves which, #323), so that any other later commit needs such a comment naming the head,
# or the merge where that stops, by its whole SHA; while Codex's own is running, only such a comment posted after it began,
# as Codex's summary shows; where Codex marks a finding of its security review open, only such a comment settles it,
# posted after Codex's summary last changed and, where one is to be found, after its newest finding; nothing else
# counts. A pure sync needs none where no review starts by itself (floor rule 8): the job runs the default branch's
# scripts/pure-sync.mjs on the head itself, and one it proves passes with no review and no note
# (scripts/security-review.mjs, whose header says what it does not hold). Where the pull request's files show a change
# to what runs by itself beyond its pins, it asks floor rule 3's two security reviews (the same script says
# which count, and when one is enough); of a pull request that leaves the check's scripts alone and whose head does
# not hold them as the default branch does, which stood before the check came, what the check reads more is said,
# never waited for. A project
# calls it (workflow_call) from
# a workflow of its own of the same name, on pull_request (the types opened, reopened, synchronize and ready_for_review)
# and on issue_comment (created and edited), so that the status follows a review the moment its comment arrives and
# moves with each push, in a job that grants contents: read, pull-requests: read and statuses: write, pinned to a full
# commit SHA ("How a project takes the core" in README.md, point 5).
#
# Advisory, unless the caller turns that off: the status always passes and says what the check would have done ("would
# wait, ..."), so nothing waits for it until the project's owner turns that off. Turned off, the status stays pending
# until the review has run, and a ruleset can require it: the core's own waits, required once its ruleset names it
# (#320), a project's only where its owner makes it so. Where every review is a posted comment (none starts by itself,
# as through a plug-in), the repository's owner's counts with nothing to set, and the status proves that a review was
# posted for the head, not who made it: builder and reviewer may post under one login (#187). Dependabot's own pull
# request, every commit of it Dependabot's and signed by GitHub, passes it where no review of Codex's has begun on it
# (floor rule 17), and one that needs no security review and gets none by itself (floor rule 8: it touches no way in)
# says so in a comment that opens "Security review:", naming the head.
#
# In a private repository each run is a job its owner pays for, a dozen or so a pull request, for a status that only
# advises: there the job is skipped, which GitHub does not bill (core archive 201), unless the caller turns it on with
# the input "private", or has turned advisory off, since a ruleset may then wait for the status. A ruleset that
# requires the status while it advises waits for good in a private repository: such a project passes "private".
#
# What keeps it safe, since a comment starts it and it may write a status (floor rule 2): it checks out the default
# branch, never the pull request, and runs only that branch's copies of the scripts; a comment's text is read only in
# the job's condition and as data from GitHub's API, never written into a run line; it runs for a comment only where
# that is the summary of Codex's app or opens "Security review:" or "Code review:" from the owner, a member or a
# collaborator; on pull_request it runs only for a branch of the repository itself and not for Dependabot, whose token
# could not write the status (theirs is written when the first comment that counts arrives: on Dependabot's own, Codex's
# summary, once the code review that floor rule 17 asks for is asked); and the token can read, and write a commit
# status, nothing more. The proofs of a pure sync and of the merges from main fetch the head's commits into a clone of
# their own and check out nothing, so no file of the pull request's is written to disk or run (git's merge of two
# commits writes only the trees it makes, into that clone); git is given the token for this repository's own address
# alone, in the fetch's and pure-sync.mjs's environment, and nothing writes it to disk. A posted review that is later
# edited away or deleted is seen at the next push, not at once.
name: security-review

on:
  workflow_call:
    inputs:
      advisory:
        description: Whether the status always passes, saying what the check would have done. Left out, it does.
        required: false
        type: boolean
        default: true
      root:
        description: The folder that holds the core's scripts/ and .node-version. Left out, core.
        required: false
        type: string
        default: core
      private:
        description: Whether it runs in a private repository, where each run is a billed job, while it is advisory. Left out, it does not.
        required: false
        type: boolean
        default: false
      reviewers:
        description: The accounts, besides the repository's owner, whose posted "Security review:" counts, by login, separated by spaces. Left out, none.
        required: false
        type: string
        default: ""

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  report:
    if: >-
      ${{ (!github.event.repository.private || inputs.private || !inputs.advisory)
      && ((github.event_name == 'pull_request' && !github.event.pull_request.draft
      && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
      || (github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.issue.state == 'open'
      && ((github.event.comment.user.login == 'chatgpt-codex-connector[bot]'
      && startsWith(github.event.comment.body, '<!-- codex-pull-request-review-summary -->'))
      || (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      && (startsWith(github.event.comment.body, 'Security review:')
      || startsWith(github.event.comment.body, '**Security review:')
      || (!inputs.advisory && (startsWith(github.event.comment.body, 'Code review:')
      || startsWith(github.event.comment.body, '**Code review:')))))))) }}
    # one at a time for a pull request, in the order they came: the last to run has read the newest comments
    concurrency:
      group: security-review-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }} # the default branch's script, never the pull request's
          persist-credentials: false # nothing after the checkout needs git's token
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.root }}/.node-version # the one exact Node ("Node" in modules/updates.md)
      - name: Has the security review run, and has a running code review finished?
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          ROOT: ${{ inputs.root }}
          ADVISORY: ${{ inputs.advisory }}
          REVIEWERS: ${{ inputs.reviewers }}
          SERVER: ${{ github.server_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ ! -f "$ROOT/scripts/security-review.mjs" ]; then
            echo "The default branch does not hold the check's script yet: nothing to say."
            exit 0
          fi
          d=$(mktemp -d)
          gh api "repos/$REPO/pulls/$NUMBER" > "$d/pull.json"
          gh api --paginate --slurp "repos/$REPO/issues/$NUMBER/comments?per_page=100" > "$d/comments.json"
          gh api --paginate --slurp "repos/$REPO/pulls/$NUMBER/comments?per_page=100" > "$d/findings.json"
          gh api --paginate --slurp "repos/$REPO/pulls/$NUMBER/commits?per_page=100" > "$d/commits.json"
          gh api --paginate --slurp "repos/$REPO/pulls/$NUMBER/files?per_page=100" > "$d/files.json"
          # whether the pull request is held by what a script of the check reads more: not where it leaves the script
          # alone and its head holds it as it stood before this branch's (it stood before the check came, and is told,
          # never waited for: AGENTS.md, "Nothing locks a project"); always where it changes the script itself, where
          # its list of files is cut short, or where the head's copy cannot be read for any reason but its absence
          head=$(jq -r '.head.sha // empty' "$d/pull.json")
          held() {
            local p="$ROOT/scripts/$1" theirs
            p="${p#./}"
            [[ "$head" =~ ^[0-9a-f]{40}$ ]] || { echo true; return; }
            if [ "$(jq '[.[][]] | length' "$d/files.json")" != "$(jq '.changed_files' "$d/pull.json")" ] \
              || jq -e --arg p "$p" 'any(.[][]; .filename == $p or .previous_filename == $p)' "$d/files.json" \
                > /dev/null
            then echo true; return; fi
            if theirs=$(gh api "repos/$REPO/contents/$p?ref=$head" --jq .sha 2> "$d/error"); then
              if [ "$theirs" = "$(git rev-parse "HEAD:$p")" ]; then echo true; else echo false; fi
            elif grep -q "HTTP 404" "$d/error"; then echo false # the head holds no such script: from before it came
            else echo true; fi
          }
          # the head's commits, in a clone of its own that fetches them by the head's SHA (never a ref GitHub moves after
          # the push) and checks out nothing, all within the job's time so its status is always written, so no file of
          # the pull request's is on disk and none runs; git sends the token to this repository's own address alone,
          # from each command's environment, never written to disk. Fetched for two proofs alone: where the pull
          # request has a sync's shape (the manifest among its files, all of them whole, and none outside core/, it and
          # the workflows), and where its head is an update from main (a merge whose second parent is no commit of the
          # pull request's)
          shape= merge= cloned= pure=
          if [ -f "$ROOT/scripts/pure-sync.mjs" ] && [[ "$head" =~ ^[0-9a-f]{40}$ ]] \
            && [ "$(jq '[.[][]] | length' "$d/files.json")" = "$(jq '.changed_files' "$d/pull.json")" ] \
            && jq -e 'any(.[][]; .filename == "core-manifest.md") and all(.[][]; .filename == "core-manifest.md"
              or (.filename | startswith("core/")) or (.filename | test("^\\.github/workflows/[^/]+\\.ya?ml$")))' \
              "$d/files.json" > /dev/null
          then shape=1; fi
          if [ -f "$ROOT/scripts/clean-merges.mjs" ] && [[ "$head" =~ ^[0-9a-f]{40}$ ]] \
            && jq -e --arg h "$head" '[.[][]] as $c | [$c[].sha] as $s | any($c[]; .sha == $h
              and (.parents | length) == 2 and (.parents[1].sha as $p | any($s[]; . == $p) | not))' \
              "$d/commits.json" > /dev/null
          then merge=1; fi
          if [ -n "$shape$merge" ]; then
            key=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
            echo "::add-mask::$key"
            n=${GIT_CONFIG_COUNT:-0}
            auth=("GIT_CONFIG_COUNT=$((n + 1))" "GIT_CONFIG_KEY_$n=http.$SERVER/$REPO.git.extraheader"
              "GIT_CONFIG_VALUE_$n=AUTHORIZATION: basic $key")
            if git init -q -b pr "$d/pr" && git -C "$d/pr" remote add origin "$SERVER/$REPO.git" \
              && env "${auth[@]}" timeout 90 git -C "$d/pr" fetch -q --no-tags --update-head-ok origin "+$head:refs/heads/pr" \
              && [ "$(git -C "$d/pr" rev-parse refs/heads/pr)" = "$head" ]
            then cloned=1; fi
          fi
          # a pure sync needs no security review where none starts by itself (floor rule 8; #99): the default branch's
          # pure-sync.mjs proves it on the head, in that clone
          if [ -n "$shape" ]; then
            proof="$PWD/$ROOT/scripts/pure-sync.mjs"
            if [ -n "$cloned" ] && (cd "$d/pr" && env "${auth[@]}" timeout 120 node "$proof" > "$d/pure.txt" 2>&1)
            then pure=$head; echo "A pure sync, as pure-sync.mjs proves: it needs no security review of its own."
            else echo "Not proved a pure sync: it gets its security review as any pull request."; fi
          fi
          # an update from main stands for nothing reviewed before it unless it is the merge git makes of its parents
          # (#323): the default branch's clean-merges.mjs proves which are, in that clone, with no token; where it
          # cannot, none is, and a review of the head is asked (a default branch whose core is older has no such
          # script, and its scripts read the parents alone, as before)
          merges=()
          if [ -f "$ROOT/scripts/clean-merges.mjs" ]; then echo '[]' > "$d/merges.json"; merges=("$d/merges.json"); fi
          if [ -n "$merge" ]; then
            proof="$PWD/$ROOT/scripts/clean-merges.mjs"
            if [ -n "$cloned" ] && (cd "$d/pr" && timeout 60 node "$proof" "$d/pull.json" "$d/commits.json" > "$d/proved.json") \
              && jq -e 'type == "array"' "$d/proved.json" > /dev/null
            then mv "$d/proved.json" "$d/merges.json"; echo "Merges from main that are the ones git makes: $(jq -r 'length' "$d/merges.json")."
            else echo "The merges from main could not be proved the ones git makes: a review of the head is asked."; fi
          fi
          BOUND=$(held security-review.mjs) PURE="$pure" node "$ROOT/scripts/security-review.mjs" "$d/pull.json" \
            "$d/comments.json" "$d/findings.json" "$d/commits.json" "$d/files.json" "${merges[@]}" > "$d/out.json"
          sha=$(jq -r '.sha // empty' "$d/out.json")
          if [ -z "$sha" ]; then
            echo "The pull request is closed or a draft: nothing to say."
            exit 0
          fi
          jq -r '.status | "\(.state): \(.description)"' "$d/out.json"
          # (a summary of Codex's it cannot read: the check's own fixed words, never the comment's)
          if jq -e '.warning' "$d/out.json" > /dev/null; then echo "::warning::$(jq -r '.warning' "$d/out.json")"; fi
          jq '.status' "$d/out.json" | gh api -X POST "repos/$REPO/statuses/$sha" --input - > /dev/null
          # the second status, code-review: whether a code review running on that commit has finished (a default branch
          # whose core is older has no such script, and says nothing of it)
          # (a fault in it warns and leaves the job as green as the security-review status left it)
          if [ -f "$ROOT/scripts/code-review-wait.mjs" ]; then
            if BOUND=$(held code-review-wait.mjs) node "$ROOT/scripts/code-review-wait.mjs" "$d/pull.json" \
              "$d/comments.json" "$d/commits.json" "$d/files.json" "${merges[@]}" > "$d/code.json" \
              && jq -r '.status | "\(.state): \(.description)"' "$d/code.json" \
              && jq '.status' "$d/code.json" | gh api -X POST "repos/$REPO/statuses/$sha" --input - > /dev/null; then :
            else echo "::warning::the code-review status could not be written: scripts/code-review-wait.mjs or its post failed"; fi
          fi
