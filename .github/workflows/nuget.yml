# The NuGet check (floor rules 7, 10 and 15), for a project whose packages come from NuGet (.NET): on every pull
# request, Dependabot's included, it restores each project file git knows from its lock file alone, with the .NET SDK
# the runner holds (`dotnet restore --locked-mode`, NuGet's own tool, which fails where a lock file is not what the
# project file asks for, and holds each package to the hash its lock file names), each into a folder of its own, NuGet's caches inside it; and
# after each project's restore, before the next's, runs the caller's own core/scripts/nuget.mjs on that folder (with
# --restored and the project's lock file), which holds every package in the lock files, and whatever else the restore
# brought, to its licence list, and what a lock file names to one exact version, reading each licence from the
# manifest of the package the restore brought, the folder then taken out, so that no project's restore runs beside
# what another's brought. What that script holds and does not, it says itself. A project calls
# this (workflow_call) from a workflow of its own of the same name, on every pull request (a private repository, as the
# starter kit writes its call, on one that changes a file NuGet reads by name, so that no other bills a job), pinned
# to a full commit SHA ("How a project takes the core" in README.md, point 5), passing the licence check's config, or
# calls core.yml with nuget, which runs the same in its one job (#376); its steps are the project's own
# core/scripts/checks.mjs's, its first look core/scripts/nuget-look.sh. It fails from a
# project's first day (core archive 198). With "advisory" (off unless a project turns it on) it says what it would
# fail and passes, a restore that fails included: for a project where the check itself is at fault, while that is
# reported to the core and mended, and never to let a package through. A restore runs the pull request's own project
# files, as its build would, and what they run could change anything in this job after it, the script and the manifests
# it reads included: so no restore runs, the first look's own neither, unless the run proves the code the repository's
# own (a pull request whose event names this repository as its head's; a pull request from another repository that
# changes what NuGet reads fails, saying its mend, and one that changes nothing it reads passes); and before the restore a step fetches every package the lock files name, and every tool a manifest
# of dotnet's names (dotnet-tools.json, in .config/ or any folder), holds each package to its lock file's content hash
# and reads each licence from its own file (core/scripts/nuget-fetch.mjs, then nuget.mjs with --fetched; core archive
# 201), and the project's files as committed, failing a form in one that it does not read (a target, a task, a
# download or an SDK from a package, a setting that turns how the restore runs or where a build imports from, an Import
# it cannot follow, a global.json's setting beyond the SDK's version), where the project has a .NET project file,
# unless the base held it or the config declares it: a verdict no build the pull request changed has run
# beside (the first look below runs a build only where nothing it reads changed from the base, and so runs the base's
# build files, which may run what else the pull request changed, gaining nothing the read judges); after the restore
# the script reads nothing of git's for the base (nuget.mjs with --restored), since the restore could have rewritten
# what git reads it by, each comparison with the base having been made before it, and what a target or a task the base
# held or the config declares writes once the restore runs it, it reads as it finds it; and this runs with contents:
# read and no secret, nothing after the checkout holds the token, no step of this job's own runs after it (the actions'
# own clean-up after the job holds no more than the restore's code already reaches), and what a pull request does to
# its project files is the reviews' to read, as with every check that builds. Where the packages come from is this
# restore's to say (floor rule 7): NuGet's own registry and the
# sources the config names, given to every restore, which overrules what a NuGet.Config names, and the script then
# reads, by NuGet's own record beside each package it brought (.nupkg.metadata), that it took none from elsewhere; a
# source that asks for a sign-in has none here. A project for Windows alone restores here all the same
# (EnableWindowsTargeting); one whose SDK the runner lacks restores in a workflow of its own, and runs the script there.
# Before that, and before anything of the pull request's runs, core/scripts/lookup.mjs asks NuGet's registry of each
# package the pull request brings into a lock file that no lock file of its base held (floor topic 15, "A new one is
# looked up in its registry"), failing an id the registry does not know and one first published under 90 days ago, and
# printing the rest for the review; it reaches NuGet's registry and GitHub's public API, with no token.
# It first looks whether the pull request changes anything NuGet reads, so that a private repository pays for no
# restore a pull request cannot have changed, while the check still reports on every pull request (core archive 201).
# Two looks: git's own diff against the base, as the signature check looks, for a project file, a lock file, a .props,
# .targets, Directory.Build or response file, a .user file beside a project file, any file an Import in one, or a
# property MSBuild's own targets import a file by, brings in, and any file whose root element is a Project or that
# begins as XML past the bound the script reads to (core/scripts/nuget.mjs --imports), packages.config, a NuGet.Config,
# a global.json, .NET's tools manifest, a package file, a .gitattributes, the licence check's config and its audit, a
# folder the config names as a source, the core's Node version and the calling workflow; and, where none changed,
# NuGet's own word that every lock file still holds what its project asks for, however it asks (an import, a property,
# any file a build reads), from a restore against an empty source that downloads nothing, under a NuGet config of its
# own, so that a project's mapping of packages to sources has no say there. It passes without a restore only where both
# say so. Any doubt runs it: no base, a base that cannot be fetched, a config or Imports that cannot be read, a listed
# file that is a link, an error of the restore's other than a locked package not found, or a package downloaded beside a
# lock file, save the SDK's own reference packs (Microsoft.NETCore.App.Ref, Microsoft.WindowsDesktop.App.Ref and
# Microsoft.AspNetCore.App.Ref), which it adds by itself. What the second look leaves to the next change of a lock file:
# a source that a build file adds, from which a package of the same content hash would come, since every package's bytes
# are its lock file's.
name: nuget

on:
  workflow_call:
    inputs:
      config:
        description: The licence check's config, a JSON file in the calling repository, with its "nuget" (core/scripts/nuget.mjs).
        required: true
        type: string
      advisory:
        description: Whether it only says what it would fail (true, while a fault of the check's own is mended) or fails the pull request (false).
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  nuget:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # (a pull request's run gives way to a newer one for the same pull request, whose head it no longer is; a run on
    # main, a schedule or a start by hand is its own group and is never cancelled; #388)
    concurrency:
      group: nuget-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}-${{ inputs.config }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing after the checkout needs the token
          fetch-depth: 2 # the merge commit and its parents: the base the next step diffs from
      - name: The manifest is a file of the checkout's own, where one stands
        timeout-minutes: 1
        run: |
          set -euo pipefail
          # (the steps after it read it whole, so it is read only where it is a regular file inside the checkout, within a
          # mebibyte, a link to one there too, as the scripts' manifestText follows one: anything else would hold a
          # runner, or read beyond it. The same step stands in core.yml and in each workflow a project calls)
          [ -e core-manifest.md ] || [ -L core-manifest.md ] || exit 0
          real=$(realpath -e -- core-manifest.md 2> /dev/null || true) here=$(realpath -e -- .)
          if [ ! -f core-manifest.md ] || [[ "$real" != "$here"/* ]] || [ "$(stat -L -c %s -- core-manifest.md)" -gt 1048576 ]; then
            echo "FAIL core-manifest.md is no regular file of this repository's own within a mebibyte (a folder, a device, a pipe, a file past that bound, or a link that leads out of the checkout). Mend: write the manifest as a plain file at the repository's root, as the sync writes it, in place of anything else there."; exit 1
          fi
      - name: Where the core's copy stands, for the NuGet check (core-manifest.md's "Core:" line; the core's tasks/repositories.md)
        id: core-at
        run: |
          at=$(sed -n -E 's#^Core: [^ ]+( at [0-9a-f]{40}, copied whole|, carried by (([A-Za-z0-9_][A-Za-z0-9._-]*/)+)) under (([A-Za-z0-9_][A-Za-z0-9._-]*/)+)( .*)?$#\4 \2#p' core-manifest.md 2>/dev/null | head -n 1)
          set -- ${at:-core/}; [ -z "${2:-}" ] || [ -e "$1scripts" ] || git submodule update --init --depth 1 -- "${2%/}" || { echo "FAIL the library ${2%/}, a submodule that carries the core, could not be fetched here. Mend: commit the library's files in this repository, or make the submodule one this workflow can fetch with no token."; exit 1; }; echo "CORE_AT=$1" >> "$GITHUB_ENV"
      # (before the first look, which asks the script what files the project's Imports bring in)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ env.CORE_AT }}.node-version # the one exact Node ("Node" in the core's tasks/updates.md)
      - name: The core's packages, installed from its lock file for the NuGet check (#654)
        run: if [ -f "${CORE_AT}scripts/install.mjs" ]; then node "${CORE_AT}scripts/install.mjs"; fi
      - name: The NuGet check (its steps in scripts/checks.mjs, its part nuget, and the first look in scripts/nuget-look.sh)
        env:
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }} # the merge's first parent, which the checkout holds (#1231); empty where the caller runs on anything but a pull request
          CALLER: ${{ github.workflow_ref }} # the calling workflow, by its own path, whatever it is named
          CONFIG: ${{ inputs.config }}
          ADVISORY: ${{ inputs.advisory }}
        run: |
          set -- nuget --nuget "$CONFIG" ${BASE:+--base "$BASE"}; [ "$ADVISORY" != true ] || set -- "$@" --advisory
          node "$CORE_AT"scripts/checks.mjs "$@"
