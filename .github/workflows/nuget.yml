# The NuGet check (floor rules 7, 10 and 15), for a project whose packages come from NuGet (.NET): on every pull
# request, Dependabot's included, it restores the project's packages from its lock files alone, with the .NET SDK the
# runner holds (`dotnet restore --locked-mode`, NuGet's own tool, which fails where a lock file is not what the project
# files ask for, and holds each package to the hash its lock file names), into a folder of its own; and then runs the
# caller's own core/scripts/nuget.mjs, which holds every package in those lock files to one exact version and to its
# licence list, reading each licence from the manifest of the package the restore brought. What that script holds and
# does not, it says itself. A project calls this (workflow_call) from a workflow of its own of the same name, on every
# pull request, pinned to a full commit SHA ("How a project takes the core" in README.md, point 5), passing the licence
# check's config and what to restore. While "advisory" (on unless turned off) it says what it would fail and passes, a
# restore that fails included, so a project's first weeks with it show whether it is right before anything waits for it.
# A restore reads the pull request's own project files, as its build would: this runs with contents: read and no
# secret, and nothing after the checkout holds the token. Where the packages come from is the project's NuGet.Config's
# to say and the reviews' to weigh: this check reads what the restore brought. A project for Windows alone restores
# here all the same (EnableWindowsTargeting); one whose SDK the runner lacks restores in a workflow of its own, and
# runs the script there.
name: nuget

on:
  workflow_call:
    inputs:
      config:
        description: The licence check's config, a JSON file in the calling repository, with its "nuget" (core/scripts/nuget.mjs).
        required: true
        type: string
      restore:
        description: What to restore, from the repository's root, a solution or project file or the folder that holds one. Left out, the root itself.
        required: false
        type: string
        default: "."
      advisory:
        description: Whether it only says what it would fail (true, as it starts) or fails the pull request (false).
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  nuget:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing after the checkout needs the token
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: core/.node-version # the one exact Node ("Node" in the core's modules/updates.md)
      - name: Restore from the lock files alone
        env:
          RESTORE: ${{ inputs.restore }}
          ADVISORY: ${{ inputs.advisory }}
          NUGET_PACKAGES: ${{ runner.temp }}/nuget-packages # a folder of its own: only what this restore brings
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
          DOTNET_NOLOGO: "1"
          EnableWindowsTargeting: "true"
        run: |
          # (named from the root, behind "./", so that no name is read as an option)
          if ! dotnet restore --locked-mode "./$RESTORE"; then
            echo "The restore from the lock files failed: a lock file is not what the project files ask for, or a package is not what its lock file names (floor rule 15)."
            [ "$ADVISORY" = true ] || exit 1
            echo "Advisory: nothing fails for it yet."
          fi
      - name: Every package one exact version, and under a licence on its list
        env:
          CONFIG: ${{ inputs.config }}
          ADVISORY: ${{ inputs.advisory }}
          NUGET_PACKAGES: ${{ runner.temp }}/nuget-packages
        run: |
          if [ "$ADVISORY" = true ]; then node core/scripts/nuget.mjs "$CONFIG" --packages "$NUGET_PACKAGES" --advisory
          else node core/scripts/nuget.mjs "$CONFIG" --packages "$NUGET_PACKAGES"; fi
