# The daily job of a project that takes the core: once a day, the core-moved check (core/scripts/core-moved.mjs: one
# issue open while the core is past the project's copy, as core-moved.yml says) and then the scheduled look
# (core/scripts/look.mjs: the issues it keeps of what has stopped, what is due and what is overdue, and once a month the
# state report; roles/orchestrator.md, "The scheduled look"). One job, so a project gains no billed minute over the
# core-moved job it ran before. A project calls it (workflow_call) from a daily schedule of its own (it runs on a
# schedule or when started by hand, and on no other event), pinned to a full commit SHA, from a job that grants
# `contents: read`, `issues: write`, `pull-requests: read`, `checks: read` and `statuses: read`, as the starter kit's
# look.yml has it
# (core/setup/template/workflows/look.yml.tmpl). It runs the project's own scripts on the core's one exact Node; Node's
# own modules only, no package installed. Nothing is checked out but the calling repository's default branch, and no
# text of a pull request or an issue reaches a command: the scripts read them through gh's answers alone. It may write
# issues, and read pull requests, checks and statuses; nothing else.
name: look

on:
  workflow_call:

permissions:
  contents: read

jobs:
  look:
    # never on a pull request's or a push's event (floor rule 2); the checkout below takes the default branch whatever
    # branch a manual start names, so the scripts it runs and the files they read are always that branch's
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: read
      checks: read
      statuses: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }} # the project's own state, not a task's branch
          persist-credentials: false # gh below takes its token from GH_TOKEN, nothing from the checkout
      - name: Where the core's copy stands, for the scheduled look (core-manifest.md's "Core:" line; the core's tasks/repositories.md)
        id: core-at
        run: |
          at=$(sed -n -E 's#^Core: [^ ]+( at [0-9a-f]{40}, copied whole|, carried by (([A-Za-z0-9_][A-Za-z0-9._-]*/)+)) under (([A-Za-z0-9_][A-Za-z0-9._-]*/)+)( .*)?$#\4 \2#p' core-manifest.md 2>/dev/null | head -n 1)
          set -- ${at:-core/}; [ -z "${2:-}" ] || [ -e "$1scripts" ] || git submodule update --init --depth 1 -- "${2%/}" || { echo "FAIL the library ${2%/}, a submodule that carries the core, could not be fetched here. Mend: commit the library's files in this repository, or make the submodule one this workflow can fetch with no token."; exit 1; }; echo "CORE_AT=$1" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ env.CORE_AT }}.node-version # the one exact Node ("Node" in the core's tasks/updates.md)
      - name: The core's packages, installed from its lock file (#654)
        run: if [ -f "${CORE_AT}scripts/install.mjs" ]; then node "${CORE_AT}scripts/install.mjs"; fi
      - name: One issue while the core is ahead of the project's copy
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "$CORE_AT"scripts/core-moved.mjs
      - name: The scheduled look
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "$CORE_AT"scripts/look.mjs
