name: probe-bench
on:
  push:
    branches: [fix-951-projects-time]
permissions:
  contents: read
jobs:
  bench:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash probe/bench.sh
