# Dependabot version updates of the workflows' GitHub actions and of the core's own packages (floor rules 3, 7 and 17).
# A release is proposed only a week after it came out (cooldown), so a bad release is usually pulled first (floor rule 7).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  # The packages of other publishers the core's scripts run, in its package.json and lock file in .packages/ (#654):
  # each update's licence read from the lock by the core's licence check, its arrival by the lookup.
  - package-ecosystem: "npm"
    directory: "/.packages"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    groups:
      packages:
        patterns: ["*"]
        update-types: ["minor", "patch"] # a new major is its own PR (tasks/updates.md)
